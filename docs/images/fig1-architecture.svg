<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 960" width="640" height="960" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5560"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b23b2e"/>
    </marker>
  </defs>
  <rect width="640" height="960" fill="#ffffff"/>

  <!-- swim lanes -->
  <rect x="12"  y="62" width="196" height="770" rx="14" fill="#f2f7fb"/>
  <rect x="222" y="62" width="196" height="770" rx="14" fill="#f1f8f4"/>
  <rect x="432" y="62" width="196" height="770" rx="14" fill="#fdf7ea"/>
  <text x="110" y="44" text-anchor="middle" font-size="21" font-weight="700" fill="#1d5f8c">模型负责写</text>
  <text x="320" y="44" text-anchor="middle" font-size="21" font-weight="700" fill="#2f6b4f">代码负责查</text>
  <text x="530" y="44" text-anchor="middle" font-size="21" font-weight="700" fill="#8a5a00">人负责定</text>

  <!-- start -->
  <rect x="270" y="80" width="100" height="40" rx="20" fill="#ffffff" stroke="#4a5560" stroke-width="1.5"/>
  <text x="320" y="107" text-anchor="middle" font-size="18" fill="#2b2f33">原文</text>
  <path d="M320 120 V148" stroke="#4a5560" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- r1 code: split -->
  <rect x="225" y="150" width="190" height="64" rx="10" fill="#e5f2ea" stroke="#2f6b4f" stroke-width="1.5"/>
  <text x="320" y="189" text-anchor="middle" font-size="19" fill="#1f4a36">切分段落</text>
  <path d="M320 214 V270 H207" stroke="#4a5560" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- r2 model: audit -->
  <rect x="15" y="238" width="190" height="64" rx="10" fill="#e6eff6" stroke="#1d5f8c" stroke-width="1.5"/>
  <text x="110" y="265" text-anchor="middle" font-size="19" fill="#163f5e">审核 Agent</text>
  <text x="110" y="290" text-anchor="middle" font-size="15" fill="#4a6478">只找问题，不改文字</text>
  <path d="M110 302 V324" stroke="#4a5560" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- r3 model: rewrite -->
  <rect x="15" y="326" width="190" height="64" rx="10" fill="#e6eff6" stroke="#1d5f8c" stroke-width="1.5"/>
  <text x="110" y="353" text-anchor="middle" font-size="19" fill="#163f5e">改写 Agent</text>
  <text x="110" y="378" text-anchor="middle" font-size="15" fill="#4a6478">每段一个，并行</text>
  <path d="M110 390 V446 H223" stroke="#4a5560" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- r4 code: gate -->
  <rect x="225" y="414" width="190" height="64" rx="10" fill="#e5f2ea" stroke="#2f6b4f" stroke-width="2.5"/>
  <text x="320" y="441" text-anchor="middle" font-size="19" fill="#1f4a36">代码校验</text>
  <text x="320" y="466" text-anchor="middle" font-size="15" fill="#3f6b55">数字·单位·方向·引用·论断</text>
  <!-- retry loop -->
  <path d="M290 414 V358 H207" stroke="#b23b2e" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#arrR)"/>
  <text x="300" y="350" font-size="15" fill="#b23b2e">不通过</text>
  <!-- retry note -->
  <rect x="440" y="392" width="182" height="108" rx="10" fill="#ffffff" stroke="#b23b2e" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="452" y="420" font-size="15" fill="#8a2a20">带着错误原因重写，</text>
  <text x="452" y="444" font-size="15" fill="#8a2a20">最多 3 次；</text>
  <text x="452" y="468" font-size="15" fill="#8a2a20">仍不通过，保留原文</text>
  <path d="M415 446 H438" stroke="#b23b2e" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/>
  <path d="M320 478 V500" stroke="#4a5560" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- r5 code: section gate -->
  <rect x="225" y="502" width="190" height="64" rx="10" fill="#e5f2ea" stroke="#2f6b4f" stroke-width="1.5"/>
  <text x="320" y="541" text-anchor="middle" font-size="19" fill="#1f4a36">整节校验</text>
  <path d="M320 566 V622 H207" stroke="#4a5560" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- r6 model: claim checker -->
  <rect x="15" y="590" width="190" height="64" rx="10" fill="#e6eff6" stroke="#1d5f8c" stroke-width="1.5"/>
  <text x="110" y="617" text-anchor="middle" font-size="19" fill="#163f5e">论断检查 Agent</text>
  <text x="110" y="642" text-anchor="middle" font-size="15" fill="#4a6478">结论有没有超出证据</text>
  <path d="M110 654 V710 H433" stroke="#4a5560" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- r7 human: review -->
  <rect x="435" y="678" width="190" height="64" rx="10" fill="#fbf0d9" stroke="#8a5a00" stroke-width="1.5"/>
  <text x="530" y="705" text-anchor="middle" font-size="19" fill="#5c3c00">网页审阅</text>
  <text x="530" y="730" text-anchor="middle" font-size="15" fill="#7a5a20">逐条接受或拒绝</text>
  <path d="M530 742 V764" stroke="#4a5560" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- r8 human: export -->
  <rect x="435" y="766" width="190" height="58" rx="10" fill="#fbf0d9" stroke="#8a5a00" stroke-width="1.5"/>
  <text x="530" y="790" text-anchor="middle" font-size="19" fill="#5c3c00">导出终稿</text>
  <text x="530" y="813" text-anchor="middle" font-size="14" fill="#7a5a20">.tex / Word 修订版</text>

  <!-- layers footer -->
  <rect x="12" y="842" width="616" height="110" rx="12" fill="#f6f7f8" stroke="#d9dee3"/>
  <text x="30" y="874" font-size="16" font-weight="700" fill="#2b2f33">规则层</text>
  <text x="96" y="874" font-size="16" fill="#3d454c">Academic Humanizer 六层规则，附加到每个 Agent</text>
  <text x="30" y="904" font-size="16" font-weight="700" fill="#2b2f33">模型层</text>
  <text x="96" y="904" font-size="16" fill="#3d454c">每个 Agent 可选 Claude、DeepSeek、通义千问或本地模型</text>
  <text x="30" y="934" font-size="16" font-weight="700" fill="#2b2f33">保真层</text>
  <text x="96" y="934" font-size="16" fill="#3d454c">未通过校验的文字，进不了成稿</text>
</svg>
