# 国家自然科学基金申请书（面上/青年/重点等）。标注 verify 的内容请以当年《申请书撰写提纲》为准。
key = "nsfc"
name = "国家自然科学基金申请书"
kind = "grant"
language = "zh"
spelling = "consistent"
first_person = true        # “本项目”“申请人”“我们”均可
figure_ref = ""            # 中文申请书常用“图1” — 跟随申请人习惯

tense = """
研究基础与前期结果：用过去时/完成态陈述已做的工作和已得到的数据（“前期研究发现……”“已建立……”）。
研究内容、方案与预期：用将来/计划语态（“拟”“将”“计划”），但不要把预期写成既成事实。
"""

style = """
立项依据：先讲清楚科学问题本身，再说意义；每个关于研究现状的判断都要有文献支撑。
不要用“填补空白”“国际领先”“首次”这类无法核实的评价，除非给出依据（检索范围、对比对象）。
研究内容与目标要一一对应；关键科学问题要具体到可以被实验或模拟回答。
前期结果的论断强度不超过数据：用“表明”“提示”而非“证明”，并写明条件（工质、几何、热流密度范围）。
可行性分析写具体条件（设备、方法、前期数据），不写空泛的“团队实力雄厚”。
"""

extra_phrases = ["re:填补[^。；]{0,8}空白", "re:(?:国际|国内)领先", "首次", "具有重大意义", "意义重大",
                 "实力雄厚", "re:(?:必将|势必)", "为国家", "re:具有(?:重要的)?战略意义"]
